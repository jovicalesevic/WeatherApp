<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp | Jovica Lešević</title>
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-app">
        <header class="weather-app__header">
            <h1 class="weather-app__title">WeatherApp</h1>
            <div class="lang-switch" role="group" aria-label="Izbor jezika">
                <button type="button" class="lang-switch__btn active" data-lang="sr">SR</button>
                <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
            </div>
        </header>

        <main class="weather-app__main">
            <div id="installPrompt" class="install-prompt" hidden>
                <p class="install-prompt__text" data-i18n="installText">Instaliraj aplikaciju za brži pristup.</p>
                <button type="button" id="installBtn" class="search__btn search__btn--secondary" data-i18n="installAction">Instaliraj</button>
            </div>

            <!-- Search bar -->
            <div class="search">
                <input type="text" id="cityInput" class="search__input" placeholder="Unesite ime grada..." autocomplete="off">
                <div class="search__actions">
                    <button type="button" id="searchBtn" class="search__btn">Pretraži</button>
                    <button type="button" id="geoBtn" class="search__btn search__btn--secondary">Moja lokacija</button>
                </div>
            </div>
            <div id="recentSearches" class="recent-searches" aria-live="polite"></div>

            <!-- Error message (hidden by default) -->
            <div id="errorMsg" class="error-msg" aria-live="polite"></div>

            <!-- Loading state -->
            <div id="loadingState" class="loading-state" aria-hidden="true">
                <div class="loading-spinner"></div>
                <p data-i18n="loading">Učitavanje podataka...</p>
            </div>

            <!-- Weather card -->
            <div id="weatherCard" class="weather-card" aria-hidden="true">
                <div class="weather-card__header">
                    <h2 id="cityName" class="weather-card__city"></h2>
                    <img id="weatherIcon" class="weather-card__icon" src="" alt="">
                </div>
                <p id="weatherDesc" class="weather-card__desc"></p>
                <p id="temperature" class="weather-card__temp"></p>
                <div class="weather-card__details">
                    <div class="weather-card__detail">
                        <span class="weather-card__label" data-i18n="labelHumidity">Vlažnost</span>
                        <span id="humidity" class="weather-card__value"></span>
                    </div>
                    <div class="weather-card__detail">
                        <span class="weather-card__label" data-i18n="labelWind">Brzina vetra</span>
                        <span id="windSpeed" class="weather-card__value"></span>
                    </div>
                    <div class="weather-card__detail">
                        <span class="weather-card__label" data-i18n="labelFeelsLike">Osećaj</span>
                        <span id="feelsLike" class="weather-card__value"></span>
                    </div>
                    <div class="weather-card__detail">
                        <span class="weather-card__label" data-i18n="labelPressure">Pritisak</span>
                        <span id="pressure" class="weather-card__value"></span>
                    </div>
                </div>
                <p id="lastUpdated" class="weather-card__meta"></p>
            </div>

            <section id="analyticsCard" class="analytics-card" aria-live="polite">
                <h3 class="analytics-card__title" data-i18n="analyticsTitle">Mini analytics</h3>
                <div class="analytics-card__grid">
                    <div>
                        <p class="analytics-card__label" data-i18n="analyticsSearches">Pretraga (7 dana)</p>
                        <p id="analyticsSearchCount" class="analytics-card__value">0</p>
                    </div>
                    <div>
                        <p class="analytics-card__label" data-i18n="analyticsAverageTemp">Prosečna temp.</p>
                        <p id="analyticsAverageTemp" class="analytics-card__value">-</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
